kind = "web"
previewPath = "/"
title = "StreamFetch"
version = "1.0.0"
id = "artifacts/streamfetch"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 18301
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/streamfetch run build && pnpm --filter @workspace/streamfetch run serve"

[services.env]
PORT = "18301"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/streamfetch", "run", "build"]
publicDir = "artifacts/streamfetch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
