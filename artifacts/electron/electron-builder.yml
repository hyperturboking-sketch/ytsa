appId: com.ytsave.desktop
productName: YTSave
copyright: Copyright © 2025 YTSave

directories:
  output: dist-app
  buildResources: build

files:
  - dist/**/*
  - package.json

# Bundle the compiled api-server (single CJS bundle) and frontend
extraResources:
  - from: "../api-server/dist"
    to: "artifacts/api-server/dist"
    filter:
      - "**/*"
  - from: "../api-server/package.json"
    to: "artifacts/api-server/package.json"
  - from: "../streamfetch/dist"
    to: "artifacts/streamfetch/dist"
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icons/256x256.png
  # Code signing — set CSC_LINK and CSC_KEY_PASSWORD env vars when you have a
  # certificate. Without a cert the installer works but SmartScreen will warn.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: YTSave
  installerIcon: build/icons/256x256.ico
  uninstallerIcon: build/icons/256x256.ico
  installerHeaderIcon: build/icons/256x256.ico
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icons/512x512.png
  category: public.app-category.utilities
  darkModeSupport: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icons
  category: Utility

publish: null
