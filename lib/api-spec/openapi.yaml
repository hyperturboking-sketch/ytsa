openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: StreamFetch API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: video
    description: Video analysis and download operations
  - name: user
    description: User operations
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout user
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyze:
    post:
      operationId: analyzeVideo
      tags: [video]
      summary: Analyze video URL and get available formats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Video metadata and available formats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoInfo"
        "400":
          description: Invalid URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Cannot process video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /download:
    post:
      operationId: downloadVideo
      tags: [video]
      summary: Download video in selected format
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadRequest"
      responses:
        "200":
          description: Video stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Cannot download video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/history:
    get:
      operationId: getUserHistory
      tags: [user]
      summary: Get user download history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Download history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadHistoryResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: Get all users (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/downloads:
    get:
      operationId: getAdminDownloads
      tags: [admin]
      summary: Get recent downloads (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent downloads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDownloadsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    SignupRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required:
        - username
        - email
        - password

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - token
        - user

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean
        plan:
          type: string
          enum: [free, basic, pro, elite]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - email
        - isAdmin
        - createdAt

    AnalyzeRequest:
      type: object
      properties:
        url:
          type: string
      required:
        - url

    VideoFormat:
      type: object
      properties:
        formatId:
          type: string
        label:
          type: string
        ext:
          type: string
        resolution:
          type: string
          nullable: true
        filesize:
          type: integer
          nullable: true
        type:
          type: string
          enum: [video, audio]
        requiresPro:
          type: boolean
      required:
        - formatId
        - label
        - ext
        - type

    VideoInfo:
      type: object
      properties:
        title:
          type: string
        thumbnail:
          type: string
          nullable: true
        duration:
          type: integer
          nullable: true
        url:
          type: string
        formats:
          type: array
          items:
            $ref: "#/components/schemas/VideoFormat"
      required:
        - title
        - url
        - formats

    DownloadRequest:
      type: object
      properties:
        url:
          type: string
        formatId:
          type: string
        title:
          type: string
      required:
        - url
        - formatId
        - title

    DownloadRecord:
      type: object
      properties:
        id:
          type: integer
        videoTitle:
          type: string
        videoUrl:
          type: string
        selectedFormat:
          type: string
        thumbnail:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - videoTitle
        - videoUrl
        - selectedFormat
        - createdAt

    DownloadHistoryResponse:
      type: object
      properties:
        downloads:
          type: array
          items:
            $ref: "#/components/schemas/DownloadRecord"
      required:
        - downloads

    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalDownloads:
          type: integer
        recentDownloads:
          type: integer
        recentUsers:
          type: integer
      required:
        - totalUsers
        - totalDownloads
        - recentDownloads
        - recentUsers

    AdminUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean
        downloadCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - email
        - isAdmin
        - downloadCount
        - createdAt

    AdminUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
      required:
        - users

    AdminDownload:
      type: object
      properties:
        id:
          type: integer
        videoTitle:
          type: string
        videoUrl:
          type: string
        selectedFormat:
          type: string
        username:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - videoTitle
        - videoUrl
        - selectedFormat
        - createdAt

    AdminDownloadsResponse:
      type: object
      properties:
        downloads:
          type: array
          items:
            $ref: "#/components/schemas/AdminDownload"
      required:
        - downloads
